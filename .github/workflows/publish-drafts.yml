name: Publish Scheduled Drafts

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = Beijing 08:00
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check drafts directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Drafts directory contents:"
          ls -la _drafts/ || echo "No _drafts directory"
          echo "Looking for HTML files:"
          find _drafts -name "*.html" 2>/dev/null || echo "No HTML files found"

      - name: Run publish script
        id: publish
        run: |
          python scripts/publish_drafts.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit and push if published
        if: steps.publish.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-publish scheduled draft(s)"
          git push

      - name: No drafts to publish
        if: steps.publish.outputs.exit_code != '0'
        run: echo "No drafts to publish today"
