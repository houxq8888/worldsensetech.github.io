name: Auto Publish and Deploy

on:
  # 每天北京时间 08:00 自动检查并发布到期的草稿
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  
  # 手动推送代码时也触发部署
  push:
    branches: [main]
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限：需要写内容权限来推送 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true
      
      - name: Build Hugo site
        run: |
          hugo --minify --gc
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: worldsensetech.com
          commit_message: "Deploy: ${{ github.sha }}"
          force_orphan: true
      
      - name: Clean old files on Aliyun Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ secrets.ALIYUN_SERVER_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script: |
            rm -rf /var/www/worldsense/*
      
      - name: Sync to Aliyun Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ secrets.ALIYUN_SERVER_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          source: "./public/*"
          target: "/var/www/worldsense"
          strip_components: 1
          overwrite: true
      
      - name: Fix server permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ secrets.ALIYUN_SERVER_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script: |
            chown -R www-data:www-data /var/www/worldsense
            chmod -R 755 /var/www/worldsense
      
      - name: Submit to Baidu
        run: |
          SITEMAP_URL="https://worldsensetech.com/sitemap.xml"
          BAIDU_TOKEN="${{ secrets.BAIDU_PUSH_TOKEN }}"
          
          if [ -n "$BAIDU_TOKEN" ]; then
            curl -s "$SITEMAP_URL" | grep -oP '(?<=<loc>)[^<]+' | head -10 > urls.txt
            if [ -s urls.txt ]; then
              curl -H "Content-Type: text/plain" \
                   --data-binary @urls.txt \
                   "http://data.zz.baidu.com/urls?site=https://worldsensetech.com&token=$BAIDU_TOKEN"
            fi
          fi
