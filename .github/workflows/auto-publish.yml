name: Auto Publish and Deploy

on:
  # 每天北京时间 08:00 自动检查并发布到期的草稿
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  
  # 手动推送代码时也触发部署
  push:
    branches: [main]
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限：需要写内容权限来推送 gh-pages 分支
permissions:
  contents: write

# 部署互斥：本 workflow 同时被"每天 08:00 cron"和"push main"触发，
# 两者可能并发跑并互相打架（尤其 ECS 侧同步）。排队、不取消进行中的那次。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      
      - name: Build Hugo site
        run: |
          hugo --minify --gc
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: worldsensetech.com
          commit_message: "Deploy: ${{ github.sha }}"
          force_orphan: true
      
      - name: Deploy to Aliyun ECS (backup + atomic rsync sync)
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ECS_IP: ${{ secrets.ALIYUN_SERVER_IP }}
          ECS_USER: ${{ secrets.ALIYUN_SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-p 22 -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # 预检：确保服务端有 rsync（以 root 登录，缺则装）
          ssh $SSH_OPTS "$ECS_USER@$ECS_IP" 'command -v rsync >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rsync; }'
          # 1) 备份当前线上站供回滚，保留最近 5 份（.tgz 放在 worldsense 同级，rsync 不碰）
          ssh $SSH_OPTS "$ECS_USER@$ECS_IP" 'mkdir -p /var/www/worldsense; [ -n "$(ls -A /var/www/worldsense 2>/dev/null)" ] && tar czf "/var/www/worldsense.bak.$(date +%Y%m%d%H%M%S).tgz" -C /var/www/worldsense . || true; ls -1t /var/www/worldsense.bak.*.tgz 2>/dev/null | tail -n +6 | xargs -r rm -f'
          # 2) rsync --delete：逐文件增量替换，没有"先删空"的窗口；--delete 清掉线上多余旧文件
          rsync -az --delete -e "ssh $SSH_OPTS" ./public/ "$ECS_USER@$ECS_IP:/var/www/worldsense/"
          # 3) 权限：目录 755 / 文件 644，属主 www-data
          ssh $SSH_OPTS "$ECS_USER@$ECS_IP" 'chown -R www-data:www-data /var/www/worldsense; find /var/www/worldsense -type d -exec chmod 755 {} +; find /var/www/worldsense -type f -exec chmod 644 {} +'

      - name: Verify deploy (gate the search-engine push)
        env:
          ECS_IP: ${{ secrets.ALIYUN_SERVER_IP }}
        run: |
          set -euo pipefail
          fail(){ echo "[verify][FAIL] $*"; exit 1; }
          # -L：ECS 根 / 会 301→/zh/，GH Pages 根是 200 的 meta-refresh 桩，跟随后都应 200
          codeGH(){ curl -sL -o /dev/null -w '%{http_code}' "$@"; }
          codeECS(){ curl -sL -o /dev/null -w '%{http_code}' --resolve "worldsensetech.com:443:$ECS_IP" "$@"; }
          # GH Pages 腿：轮询等新构建传播（runner 默认解析即命中 GitHub Pages）
          ok=0
          for i in $(seq 1 10); do
            if [ "$(codeGH https://worldsensetech.com/)" = "200" ]; then ok=1; break; fi
            echo "[verify] GH 首页未就绪，重试 $i/10"; sleep 15
          done
          [ "$ok" = "1" ] || fail "GH Pages 首页始终非 200"
          [ "$(codeGH https://worldsensetech.com/robots.txt)" = "200" ] || fail "GH robots.txt 非 200"
          [ "$(codeGH https://worldsensetech.com/sitemap.xml)" = "200" ] || fail "GH sitemap.xml 非 200"
          # ECS 腿：强制解析到 ECS IP 验同一组
          [ "$(codeECS https://worldsensetech.com/)" = "200" ] || fail "ECS 首页非 200"
          [ "$(codeECS https://worldsensetech.com/robots.txt)" = "200" ] || fail "ECS robots.txt 非 200"
          [ "$(codeECS https://worldsensetech.com/sitemap.xml)" = "200" ] || fail "ECS sitemap.xml 非 200"
          # robots 逐字节比对：线上 vs 构建产物——直接堵死"robots 漂移"这类事故
          GH_ROBOTS="$(curl -sL --compressed https://worldsensetech.com/robots.txt)"
          ECS_ROBOTS="$(curl -sL --compressed --resolve "worldsensetech.com:443:$ECS_IP" https://worldsensetech.com/robots.txt)"
          BUILD_ROBOTS="$(cat public/robots.txt)"
          [ "$GH_ROBOTS" = "$BUILD_ROBOTS" ] || fail "GH robots 与构建不一致"
          [ "$ECS_ROBOTS" = "$BUILD_ROBOTS" ] || fail "ECS robots 与构建不一致"
          echo "[verify] OK — 双侧首页/robots/sitemap 均 200 且 robots 与构建一致，放行搜索引擎推送"

      # ------------------------------------------------------------------
      # IndexNow：Bing / Yandex / Seznam / Naver 共享队列，一次提交覆盖多家
      # 需要在 GitHub repo Settings → Secrets → Actions 添加：
      #   INDEXNOW_KEY = 与 static/<KEY>.txt 同名的一串 32 位 hex
      # 若 secret 未配置，脚本会静默跳过，不影响主部署
      # ------------------------------------------------------------------
      - name: Push URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import os, glob, re, json, time, urllib.request, urllib.error
          from pathlib import Path

          KEY = os.environ.get("INDEXNOW_KEY", "").strip()
          if not KEY:
              print("[skip] INDEXNOW_KEY secret 未配置，跳过 IndexNow 推送")
              raise SystemExit(0)

          HOST = "worldsensetech.com"
          KEY_LOCATION = f"https://{HOST}/{KEY}.txt"
          ENDPOINT = "https://api.indexnow.org/indexnow"
          ALLOWED = (f"https://{HOST}/", "https://www.worldsensetech.com/")

          loc_re = re.compile(r"<loc>(.*?)</loc>")
          urls = []
          for sm in glob.glob("public/**/sitemap*.xml", recursive=True):
              for m in loc_re.finditer(Path(sm).read_text(encoding="utf-8")):
                  u = m.group(1).strip()
                  if any(u.startswith(p) for p in ALLOWED):
                      urls.append(u)
          urls = list(dict.fromkeys(urls))
          print(f"[IndexNow] 从 public/ 提取到 {len(urls)} 条本站 URL")
          if not urls:
              raise SystemExit(0)

          # 等 keyLocation 上线（GitHub Pages / 阿里云 Nginx 可能缓存）
          reachable = False
          for attempt in range(1, 11):
              try:
                  req = urllib.request.Request(KEY_LOCATION, method="HEAD")
                  with urllib.request.urlopen(req, timeout=10) as r:
                      if r.status == 200:
                          print(f"[IndexNow] keyLocation 可达（第 {attempt} 次尝试）")
                          reachable = True
                          break
              except Exception as e:
                  print(f"[IndexNow] keyLocation 未就绪 ({attempt}/10): {e}")
              time.sleep(15)
          if not reachable:
              print("[IndexNow] 警告：150 秒内 keyLocation 仍不可达，继续尝试推送（可能被 IndexNow 拒 403）")

          BATCH = 1000
          for i in range(0, len(urls), BATCH):
              batch = urls[i:i+BATCH]
              payload = json.dumps({
                  "host": HOST,
                  "key": KEY,
                  "keyLocation": KEY_LOCATION,
                  "urlList": batch,
              }).encode("utf-8")
              req = urllib.request.Request(
                  ENDPOINT, data=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"[IndexNow] 批次 {i//BATCH + 1}: HTTP {resp.status} · {len(batch)} 条已接受")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")[:200]
                  print(f"[IndexNow] 批次 {i//BATCH + 1}: HTTP {e.code} — {body}")
                  if e.code == 403:
                      print("[IndexNow] 403：确认 static/<KEY>.txt 已部署、内容与 INDEXNOW_KEY 一致")
              except Exception as e:
                  print(f"[IndexNow] 批次 {i//BATCH + 1}: 网络错误 {e}")
          PY

      # ------------------------------------------------------------------
      # 百度推送：账号配额 10 条/天（新站默认），一次性推 378 条会被 400 拒。
      # 策略：用 actions/cache 持久化"已推游标"，每天最多推 10 条未推 URL，
      # 只有百度返回 success 才前进游标；over quota 时保持原游标等明天重试。
      # 首轮 378 条约需 38 天走完；之后每天只推新增页面。
      # ------------------------------------------------------------------
      - name: Restore Baidu push cursor
        uses: actions/cache@v4
        with:
          path: .baidu-state
          key: baidu-cursor-v1
          restore-keys: |
            baidu-cursor-v1

      - name: Submit to Baidu (10/day, persistent cursor)
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, glob, re, json, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          TOKEN = os.environ.get("BAIDU_TOKEN", "").strip()
          STATE_DIR = Path(".baidu-state")
          STATE_FILE = STATE_DIR / "pushed.json"
          DAILY_BATCH = 10
          SITE = "https://worldsensetech.com"  # 站点已规范化裸域；BAIDU_PUSH_TOKEN 须为后台裸域站点的 token
          ALLOWED = (f"{SITE}/", "https://www.worldsensetech.com/")

          if not TOKEN:
              print("[Baidu][skip] BAIDU_PUSH_TOKEN 未配置")
              raise SystemExit(0)

          # 1) 从本地 build 产物提取全量本站 URL（避免线上 sitemap SSL 抖动）
          loc_re = re.compile(r"<loc>(.*?)</loc>")
          urls = []
          for sm in glob.glob("public/**/sitemap*.xml", recursive=True):
              for m in loc_re.finditer(Path(sm).read_text(encoding="utf-8")):
                  u = m.group(1).strip()
                  if any(u.startswith(p) for p in ALLOWED):
                      urls.append(u)
          urls = list(dict.fromkeys(urls))
          print(f"[Baidu] 本站 URL 共 {len(urls)} 条")
          if not urls:
              raise SystemExit(0)

          # 2) 读已推游标（来自 actions/cache）
          STATE_DIR.mkdir(exist_ok=True)
          pushed = set()
          if STATE_FILE.exists():
              try:
                  data = json.loads(STATE_FILE.read_text(encoding="utf-8"))
                  pushed = set(data.get("urls", []))
                  print(f"[Baidu] 已推 {len(pushed)} 条 · 上次更新 {data.get('updated', '?')}")
              except Exception as e:
                  print(f"[Baidu] 游标文件损坏（{e}），从头开始")

          # 3) 差集 → 取今日 10 条
          todo = [u for u in urls if u not in pushed]
          if not todo:
              print("[Baidu] 全部 URL 已推完，本轮跳过。有新页面时会自动补进队列")
              raise SystemExit(0)
          batch = todo[:DAILY_BATCH]
          print(f"[Baidu] 待推 {len(todo)} 条 · 本轮取 {len(batch)} 条")
          for u in batch:
              print(f"       · {u}")

          # 4) POST 到百度普通收录 API
          API = f"http://data.zz.baidu.com/urls?site={SITE}&token={TOKEN}"
          payload = "\n".join(batch).encode("utf-8")
          req = urllib.request.Request(
              API, data=payload,
              headers={"Content-Type": "text/plain"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  status = resp.status
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              status = e.code
          except Exception as e:
              print(f"[Baidu] 网络错误: {e} · 游标不前进")
              raise SystemExit(0)

          print(f"[Baidu] HTTP {status}: {body[:300]}")

          # 5) 只有百度返回 success 才前进游标；over quota / error 保持原样等明日
          try:
              result = json.loads(body)
          except Exception:
              result = {}
          success = int(result.get("success") or 0)
          if success > 0:
              newly = batch[:success]
              pushed.update(newly)
              STATE_FILE.write_text(json.dumps({
                  "urls": sorted(pushed),
                  "count": len(pushed),
                  "total": len(urls),
                  "remain": result.get("remain"),
                  "updated": datetime.now(timezone.utc).isoformat(),
              }, ensure_ascii=False, indent=2), encoding="utf-8")
              print(
                  f"[Baidu] 游标 +{success} · 累计 {len(pushed)}/{len(urls)}"
                  f" · 剩余今日配额 {result.get('remain', '?')}"
              )
          else:
              msg = result.get("message") or result.get("error") or f"http_{status}"
              print(f"[Baidu] 未成功（{msg}）· 游标不前进，明天重试")
          PY
