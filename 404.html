<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - WorldSense 技术笔记</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            max-width: 680px;
            margin: 0 auto;
            padding: 4rem 2rem;
            line-height: 1.8;
            color: #1a1a2e;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { margin-bottom: 1rem; color: #64748b; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .redirect-notice {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <h1>页面未找到</h1>
    <p>你访问的页面不存在或已移动。</p>
    
    <div class="redirect-notice" id="redirect-notice" style="display: none;">
        <p>正在跳转到新地址：<a id="redirect-link" href="#">...</a></p>
    </div>

    <p>如果没有自动跳转，你可以：</p>
    <ul>
        <li><a href="/zh/">返回首页</a></li>
        <li><a href="/zh/articles/">浏览所有文章</a></li>
        <li><a href="/zh/archive/">查看文章归档</a></li>
    </ul>

    <script>
    (function() {
        // Semrush-safe: this page returns HTTP 404 and only moves the browser
        // via JS history replace (a real meta-refresh tag is NOT emitted). It
        // catches the legacy URLs left behind after Hugo aliases were removed
        // (GitHub Pages has no nginx to 301 them, unlike the Aliyun ECS leg).
        var path = window.location.pathname;

        // 1) Collapse accidental double locale prefixes (the en/*.md `aliases`
        //    bug deployed everything under /en/en/... — map it back to /en/...).
        path = path.replace(/^\/en\/en\//, '/en/').replace(/^\/zh\/zh\//, '/zh/');

        var newUrl = null;

        // 2) Articles: [/<locale>] /articles/<name>.html  ->  /<locale>/articles/<name>/
        var art = path.match(/^(?:\/(zh|en))?\/articles\/(.+)\.html$/);
        if (art) {
            newUrl = '/' + (art[1] || 'zh') + '/articles/' + art[2] + '/';
        }

        // 3) Single top-level pages: [/<locale>] /<name>.html  ->  /<locale>/<name>/
        if (!newUrl) {
            var pg = path.match(/^(?:\/(zh|en))?\/([A-Za-z0-9_-]+)\.html$/);
            if (pg) {
                newUrl = '/' + (pg[1] || 'zh') + '/' + pg[2] + '/';
            }
        }

        // 4) Unknown path: stay a real 404 (do not fabricate a redirect).
        if (newUrl) {
            var notice = document.getElementById('redirect-notice');
            var link = document.getElementById('redirect-link');
            var full = window.location.origin + newUrl;
            notice.style.display = 'block';
            link.href = newUrl;
            link.textContent = full;
            // replace() so the dead URL is not pushed into browser history.
            setTimeout(function() { window.location.replace(full); }, 3000);
        }
    })();
    </script>
</body>
</html>
