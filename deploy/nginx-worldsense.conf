# worldsensetech.com - apex-canonical (bare domain = single content site; www 301 to bare)
# 部署到阿里云 ECS 116.62.212.72，落地文件 /etc/nginx/sites-available/worldsense（symlink 进 sites-enabled）
# 证书：/etc/letsencrypt/live/worldsensetech.com 已含 apex + www 双 SAN（DNS-01 签发，因分线路 DNS 走 GitHub 使 HTTP-01 在 ECS 失败）
#
# 【关键】www 一律 301 到裸域；裸域根 / 用真 301 跳 /zh/ 取代 Hugo meta-refresh 壳；
#        验证类文件(baidu_verify_*.html)在 :80 直出，不跳 HTTPS——百度等中文爬虫常在 80 端口且不一定跟随跨协议 301。

# ---------- HTTP :80 ----------
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # serve verification files directly over HTTP (Baidu crawls on :80, may not follow 301)
    location ~ ^/baidu_verify_.*\.html$ {
        root /var/www/worldsense;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS www -> 301 bare ----------
server {
    listen 443 ssl http2;
    server_name www.worldsensetech.com;
    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    return 301 https://worldsensetech.com$request_uri;
}

# ---------- HTTPS bare domain: content site ----------
server {
    listen 443 ssl http2;
    server_name worldsensetech.com;
    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root  /var/www/worldsense;
    index index.html;

    location = / { return 301 /zh/; }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
