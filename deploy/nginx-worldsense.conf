# WorldSense Blog - Nginx Configuration
# 部署到阿里云服务器 116.62.212.72
# 文件位置: /etc/nginx/sites-available/worldsensetech.com

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name worldsensetech.com www.worldsensetech.com;
    
    # 百度验证文件
    location = /baidu_verify_codeva-RcngxmWb36.html {
        root /var/www/worldsense;
        try_files $uri =404;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://www.worldsensetech.com$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.worldsensetech.com worldsensetech.com;
    
    # SSL 证书（使用 Let's Encrypt 或阿里云免费证书）
    ssl_certificate /etc/nginx/ssl/worldsensetech.com.pem;
    ssl_certificate_key /etc/nginx/ssl/worldsensetech.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 网站根目录
    root /var/www/worldsense;
    index index.html;
    
    # 非 www 重定向到 www（统一域名）
    if ($host = 'worldsensetech.com') {
        return 301 https://www.worldsensetech.com$request_uri;
    }
    
    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # HTML 文件不缓存（确保更新即时生效）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    # 主配置
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    
    # 百度 sitemap 验证
    location = /sitemap.xml {
        root /var/www/worldsense;
        try_files $uri =404;
        add_header Content-Type application/xml;
    }
    
    # robots.txt
    location = /robots.txt {
        root /var/www/worldsense;
        try_files $uri =404;
        add_header Content-Type text/plain;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # 日志
    access_log /var/log/nginx/worldsensetech.com.access.log;
    error_log /var/log/nginx/worldsensetech.com.error.log;
}

