# WorldSense Blog - Nginx Configuration  (apex-canonical 版)
# 部署到阿里云服务器 116.62.212.72
# 文件位置: /etc/nginx/sites-available/worldsensetech.com
#
# 【关键策略变更】裸域 worldsensetech.com 为唯一 canonical，www 一律 301 到裸域。
#   原因：现有证书 SAN 只覆盖 worldsensetech.com，www 无有效证书 → 命中 www 必弹证书错误。
#   旧版 conf 反而把裸域往 www 跳（第 19、43-44 行），方向是错的，已全部反转。
#
# 前置依赖（见 host-canonical-fix.md）：先签一张覆盖双域名的证书，www 的 301 才能发出去
#   （HTTPS 跳转要求跳转源 www 自己有受信证书，否则浏览器在 TLS 握手阶段就报错、根本到不了 301）。

# ---------- HTTP：验证文件 + ACME + 其余跳 HTTPS 裸域 ----------
server {
    listen 80;
    listen [::]:80;
    server_name worldsensetech.com www.worldsensetech.com;

    # Let's Encrypt HTTP-01 验证（certbot webroot 方式用这个目录写 token）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/worldsense;
        allow all;
    }

    # 百度站长验证文件
    location = /baidu_verify_codeva-RcngxmWb36.html {
        root /var/www/worldsense;
        try_files $uri =404;
    }

    # 其余一律跳 HTTPS 裸域（注意：目标是裸域，不是 www）
    location / {
        return 301 https://worldsensetech.com$request_uri;
    }
}

# ---------- HTTPS www：仅做 301 → 裸域（需证书含 www） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.worldsensetech.com;

    # 这张证书必须同时包含 worldsensetech.com 与 www.worldsensetech.com，
    # 否则本 server 块在浏览器完成 TLS 前就报证书错误，301 发不出去。
    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;

    return 301 https://worldsensetech.com$request_uri;
}

# ---------- HTTPS 裸域：唯一内容站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name worldsensetech.com;

    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/worldsense;
    index index.html;

    # 裸域根 → 中文首页：用真 301 取代 Hugo 生成的 meta-refresh 壳
    # （meta-refresh 会丢 Referer、把直访算成 Direct，且对爬虫不如 301 干净）
    location = / {
        return 301 /zh/;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存，确保更新即时生效
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type application/xml;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    access_log /var/log/nginx/worldsensetech.com.access.log;
    error_log  /var/log/nginx/worldsensetech.com.error.log;
}
