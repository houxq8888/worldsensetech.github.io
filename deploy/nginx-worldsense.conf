# worldsensetech.com - apex-canonical (bare domain = single content site; www 301 to bare)
# 部署到阿里云 ECS 116.62.212.72，落地文件 /etc/nginx/sites-available/worldsense（symlink 进 sites-enabled）
# 证书：/etc/letsencrypt/live/worldsensetech.com 已含 apex + www 双 SAN（DNS-01 签发，因分线路 DNS 走 GitHub 使 HTTP-01 在 ECS 失败）
#
# 【关键】www 一律 301 到裸域；裸域根 / 和 Hugo 自动生成的 /index.html 均用真 301 跳 /zh/，
#        取代 Hugo 双语 defaultContentLanguageInSubdir 生成的 meta-refresh 壳；
#        历史 alias 路径（/zh/*.html、/en/*.html、旧的 /en/en/* 双前缀 bug）在 nginx 层做 301，
#        Hugo 内容层已不再输出 aliases（front matter 已清空），避免 Semrush 报 meta-refresh。
#        验证类文件(baidu_verify_*.html)在 :80/:443 都直出，不跳 HTTPS——百度等中文爬虫常在 80 端口且不一定跟随跨协议 301。

# ---------- HTTP :80 ----------
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # serve verification files directly over HTTP (Baidu crawls on :80, may not follow 301)
    location ~ ^/baidu_verify_.*\.html$ {
        root /var/www/worldsense;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS www -> 301 bare ----------
server {
    listen 443 ssl http2;
    server_name www.worldsensetech.com;
    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    return 301 https://worldsensetech.com$request_uri;
}

# ---------- HTTPS bare domain: content site ----------
server {
    listen 443 ssl http2;
    server_name worldsensetech.com;
    ssl_certificate     /etc/letsencrypt/live/worldsensetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldsensetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root  /var/www/worldsense;
    index index.html;

    # --- Legacy path redirects: turn Hugo meta-refresh aliases into real HTTP 301s ---
    # Hugo 双语根跳转壳：/ 和 /index.html 都 301 到 /zh/（前者原有，后者新增）
    location = /              { return 301 /zh/; }
    location = /index.html    { return 301 /zh/; }

    # 静态资源：30 天长缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 百度验证文件必须原样直出，不能被下面的 .html 重写规则误伤
    location ~ ^/baidu_verify_.*\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hugo 的 404 页：error_page 会内部转发到 /404.html，不能被重写成 /404/
    location = /404.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 历史遗留 /en/en/* 双前缀（旧 en/*.md 的 aliases 错把 /en/ 写进 alias 路径导致）
    # 统一 301 到正确的 /en/* 路径
    location ^~ /en/en/ {
        rewrite ^/en/en/(.+)\.html$ /en/$1/ permanent;
        rewrite ^/en/en/(.*)$ /en/$1 permanent;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri/index.html @legacyhtml;
    }

    # 仅当文件在磁盘上确实不存在时才进来：把遗留的 .html alias 请求 301 到无扩展名 pretty URL
    # （例：/zh/archive.html -> /zh/archive/）。这样不会误伤 Hugo 真实的 .../index.html（那些走 index 指令内部跳转）。
    location @legacyhtml {
        rewrite ^/(.+)\.html$ /$1/ permanent;
        return 404;
    }

    error_page 404 /404.html;
}
